packages:
  - 'apps/*'
  - 'packages/*'

# pnpm defaults this to false, which left the peer discipline of TDD §2.5.2 unenforced:
# an unsatisfied peer range is only a warning, and --frozen-lockfile never looks at peers.
# true turns every cross-major combination of §2.5.2 into an install-time failure.
strictPeerDependencies: true

# pnpm 11+ blocks every dependency's install/postinstall script by default (supply-chain
# guard) and fails the install until each one is explicitly allowed or denied here.
# '@parcel/watcher', '@scarf/scarf', msgpackr-extract and unrs-resolver never appear in
# TDD.md §2's pinned tables, so none is something this project's own code depends on a native
# build for — each has a pure-JS fallback, and all four are denied to keep `pnpm install`
# non-interactive in CI and on a fresh clone.
# '@prisma/engines' and 'prisma' are allowed: they are TDD §2.2a's pinned CLI/engine downloader,
# and without their install/preinstall scripts `prisma generate` (the root postinstall, §2.6.4)
# has no engine binary to run against and fails outright — this is not a supply-chain exception,
# it is the one native build this project's own code actually needs.
allowBuilds:
  '@parcel/watcher': false
  '@scarf/scarf': false
  msgpackr-extract: false
  unrs-resolver: false
  '@prisma/engines': true
  prisma: true
  '@swc/core': true
