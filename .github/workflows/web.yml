name: web

on:
  # No path filter on pull_request: this job is a required status check on main. A required check
  # that a path filter skips never reports, and the PR waits on it forever. The push trigger keeps
  # its filter so a merge to main only runs (and deploys) what changed.
  pull_request:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - eslint.config.js
      - scripts/**
      - .github/actions/**
      - .github/workflows/web.yml
      - apps/api/**
      - supabase/**

concurrency:
  group: web-${{ github.ref }}
  # Never cancel a run on main: a quick second merge would leave the first commit without a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# `shell: bash` implies -eo pipefail; the default `bash -e` does not, so a failing test piped
# into `tee` would leave the step green.
defaults:
  run:
    shell: bash

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      redis:
        # Copied by mirror-redis.yml: public.ecr.aws rate-limits pulls from shared runner IPs.
        image: ghcr.io/eosmin/redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # Server-side variables for the apps/api process the Playwright suite talks to. Deliberately
    # no NEXT_PUBLIC_* here: apps/api rejects that prefix at boot, so those are set per web step.
    # Placeholders only, no live credential (§17).
    env:
      WEB_ORIGIN: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_PRO_PRICE_ID: price_ci_placeholder
      AI_GATEWAY_API_KEY: ci-placeholder
      AI_DIGEST_MODEL: anthropic/claude-sonnet-4.5
      REDIS_URL: redis://127.0.0.1:6379/2
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Lint
        run: |
          pnpm --filter @feedback-board/web lint
          pnpm --filter @feedback-board/web format:check
          pnpm check:deprecations

      - name: Typecheck
        run: pnpm --filter @feedback-board/web typecheck

      - name: Unit tests with coverage
        run: pnpm --filter @feedback-board/web test:cov 2>&1 | tee "$RUNNER_TEMP/web-cov.log"

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/coverage-summary
        with:
          title: apps/web coverage
          log: ${{ runner.temp }}/web-cov.log

      # Playwright drives the real stack: GoTrue + mailbox for sign-in, apps/api for data.
      - uses: ./.github/actions/supabase-stack

      # NODE_ENV is set here only: Next.js misbuilds under a non-standard value.
      - name: Start API
        env:
          NODE_ENV: test
        run: |
          pnpm --filter "@feedback-board/api..." build
          nohup pnpm --filter @feedback-board/api start > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3001/health && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      # The browser download is the slow part; the OS libraries it links against live outside the
      # cache, so a hit still needs install-deps. The cache is saved right after the install, not
      # in the post step, so a red e2e run does not throw the download away.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: pnpm --filter @feedback-board/web exec playwright install --with-deps chromium

      - uses: actions/cache/save@v6
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Install Playwright system dependencies
        if: ${{ steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: pnpm --filter @feedback-board/web exec playwright install-deps chromium

      # Not counted toward coverage (§14.1). Playwright builds (with the real Supabase values, so
      # this is also the production-build gate) and starts the app itself.
      - name: Playwright e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.TEST_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: pnpm --filter @feedback-board/web test:e2e

      - name: API log
        if: ${{ failure() }}
        run: cat "$RUNNER_TEMP/api.log"

  # Independent of the suite above: nothing in the image depends on its output, so it runs in
  # parallel and the layer cache keeps a dependency-free change to a few seconds.
  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-image
        with:
          app: web
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder
            NEXT_PUBLIC_API_URL=http://localhost:3001
