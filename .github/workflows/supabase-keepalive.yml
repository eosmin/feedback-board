name: supabase-keepalive

# A free Supabase project pauses after a week without activity, which would take the live demo
# down. A trivial query every three days keeps it awake (TDD §15.1). Two things to know:
#   - GitHub disables scheduled workflows on a repository with no activity for 60 days; a quiet
#     portfolio needs an occasional commit or a manual re-enable.
#   - DIRECT_URL must be the session-mode pooler string: a GitHub runner has no IPv6 route and
#     Supabase's direct host is IPv6-only without the paid IPv4 add-on.
#   - Whether a plain connection counts as activity is Supabase's call, not this file's. Confirm on
#     the first run; if it does not, switch the ping to a request against the project's API.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch: {}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure psql
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Query the production database
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -c 'select 1'
