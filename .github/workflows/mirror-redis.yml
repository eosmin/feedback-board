name: mirror-redis

# The api, worker and web workflows start Redis as a service container. They used to pull it from
# public.ecr.aws, which rate-limits anonymous pulls and shares the runners' IPs with everyone, so
# jobs died in "Initialize containers" with `Data limit exceeded` before running a single step.
#
# This workflow copies the image to GitHub's own registry once a month, and the three workflows
# pull it from there. The layers stream through the runner without being unpacked or stored (about
# half a minute for the whole multi-arch image) and the multi-arch index is kept. Checked locally
# against a throwaway registry: every platform copies, the result is an index carrying the source
# annotation, and it pulls and runs. Its digest differs from upstream's because of that annotation.
#
# The first real run failed with `429 Too Many Requests` on the very first request to
# public.ecr.aws: the copy depended on the registry it exists to avoid. So the source is a list,
# tried in order, and the first registry that answers wins. All three serve the same official
# image: the index digest is identical on each, and it is printed in the log of every run. The
# second run copied from Docker Hub after mirror.gcr.io lacked a layer.
#
# First run (manual, once): Actions > mirror-redis > Run workflow. Then make the package public so
# the CI jobs can pull it without credentials: github.com/users/<owner>/packages/container/redis/settings
# > Danger Zone > Change visibility > Public.
#
# The mirror only moves when this workflow runs, so a patched `8-alpine` upstream reaches CI at the
# next scheduled copy (or a manual run), not immediately.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 5 1 * *'

# No checkout happens here, so the only permission needed is to publish the package.
permissions:
  packages: write

concurrency:
  group: mirror-redis
  cancel-in-progress: false

env:
  # Docker Hub first: it is the one that copied from a GitHub runner. mirror.gcr.io only caches what
  # someone already pulled, so it can lack layers (`content ... not found`) and cost a minute of
  # retries. public.ecr.aws goes last: it is the one that answered 429.
  SOURCES: >-
    docker.io/library/redis:8-alpine
    mirror.gcr.io/library/redis:8-alpine
    public.ecr.aws/docker/library/redis:8-alpine
  TARGET: ghcr.io/eosmin/redis:8-alpine

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Log in to ghcr.io
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Two tries per source with a short pause, then the next source. A rate limit lasts hours, so
      # waiting on one registry is worse than moving to another. Worst case: six attempts and
      # three pauses of 30 s, well inside the 15 minute timeout.
      - name: Copy the image
        run: |
          for source in $SOURCES; do
            for attempt in 1 2; do
              echo "::group::${source} (attempt ${attempt})"
              if docker buildx imagetools create \
                --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
                --tag "$TARGET" "$source"; then
                echo "::endgroup::"
                echo "Copied from ${source}"
                echo "Source index digest: $(docker buildx imagetools inspect "$source" | awk '/^Digest:/{print $2; exit}')"
                exit 0
              fi
              echo "::endgroup::"
              if [ "$attempt" -lt 2 ]; then sleep 30; fi
            done
            echo "::warning::Could not copy from ${source}; trying the next source"
          done
          echo "::error::Could not copy to $TARGET from any source: $SOURCES"
          exit 1

      - name: Show what is now in the mirror
        run: docker buildx imagetools inspect "$TARGET"
