name: commitlint

# Pull requests only, and no path filter: this checks history, not files. It is the real gate;
# the husky hook is skippable with --no-verify and absent wherever `pnpm install` never ran.
on:
  pull_request:

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      # Full history: in a shallow clone the base commit is missing and the range resolves to
      # nothing, so the job would pass having examined zero commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Lint commit messages
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
